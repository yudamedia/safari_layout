<svg width="200" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Safari-themed background pattern -->
  
  <!-- Small dots -->
  <circle cx="20" cy="20" r="2" fill="#FFFFFF" fill-opacity="0.3"/>
  <circle cx="60" cy="20" r="2" fill="#FFFFFF" fill-opacity="0.3"/>
  <circle cx="100" cy="20" r="2" fill="#FFFFFF" fill-opacity="0.3"/>
  <circle cx="140" cy="20" r="2" fill="#FFFFFF" fill-opacity="0.3"/>
  <circle cx="180" cy="20" r="2" fill="#FFFFFF" fill-opacity="0.3"/>
  
  <circle cx="20" cy="60" r="2" fill="#FFFFFF" fill-opacity="0.3"/>
  <circle cx="60" cy="60" r="2" fill="#FFFFFF" fill-opacity="0.3"/>
  <circle cx="100" cy="60" r="2" fill="#FFFFFF" fill-opacity="0.3"/>
  <circle cx="140" cy="60" r="2" fill="#FFFFFF" fill-opacity="0.3"/>
  <circle cx="180" cy="60" r="2" fill="#FFFFFF" fill-opacity="0.3"/>
  
  <circle cx="20" cy="100" r="2" fill="#FFFFFF" fill-opacity="0.3"/>
  <circle cx="60" cy="100" r="2" fill="#FFFFFF" fill-opacity="0.3"/>
  <circle cx="100" cy="100" r="2" fill="#FFFFFF" fill-opacity="0.3"/>
  <circle cx="140" cy="100" r="2" fill="#FFFFFF" fill-opacity="0.3"/>
  <circle cx="180" cy="100" r="2" fill="#FFFFFF" fill-opacity="0.3"/>
  
  <circle cx="20" cy="140" r="2" fill="#FFFFFF" fill-opacity="0.3"/>
  <circle cx="60" cy="140" r="2" fill="#FFFFFF" fill-opacity="0.3"/>
  <circle cx="100" cy="140" r="2" fill="#FFFFFF" fill-opacity="0.3"/>
  <circle cx="140" cy="140" r="2" fill="#FFFFFF" fill-opacity="0.3"/>
  <circle cx="180" cy="140" r="2" fill="#FFFFFF" fill-opacity="0.3"/>
  
  <circle cx="20" cy="180" r="2" fill="#FFFFFF" fill-opacity="0.3"/>
  <circle cx="60" cy="180" r="2" fill="#FFFFFF" fill-opacity="0.3"/>
  <circle cx="100" cy="180" r="2" fill="#FFFFFF" fill-opacity="0.3"/>
  <circle cx="140" cy="180" r="2" fill="#FFFFFF" fill-opacity="0.3"/>
  <circle cx="180" cy="180" r="2" fill="#FFFFFF" fill-opacity="0.3"/>
  
  <!-- Safari silhouettes -->
  <path d="M40,100 C40,90 50,85 60,90 C70,95 73,110 65,115 C57,120 40,110 40,100 Z" 
        fill="#FFFFFF" fill-opacity="0.2"/>
  
  <path d="M150,60 L160,65 L165,75 L160,85 L150,90 L140,85 L135,75 L140,65 Z" 
        fill="#FFFFFF" fill-opacity="0.2"/>
  
  <path d="M120,150 C125,140 135,140 140,150 C145,160 140,170 130,170 C120,170 115,160 120,150 Z" 
        fill="#FFFFFF" fill-opacity="0.2"/>
  
  <!-- Safari vehicle silhouette -->
  <path d="M70,165 H90 V170 H95 V160 H90 V165 H70 V160 H65 V170 H70 Z" 
        fill="#FFFFFF" fill-opacity="0.2"/>
  
  <!-- Lion pawprint -->
  <circle cx="30" cy="40" r="3" fill="#FFFFFF" fill-opacity="0.2"/>
  <circle cx="35" cy="45" r="2" fill="#FFFFFF" fill-opacity="0.2"/>
  <circle cx="25" cy="45" r="2" fill="#FFFFFF" fill-opacity="0.2"/>
  <circle cx="30" cy="50" r="2" fill="#FFFFFF" fill-opacity="0.2"/>
  
  <!-- Acacia tree silhouette -->
  <path d="M170,130 L173,120 L177,130 L180,125 L175,140 L165,140 L160,125 L163,130 L167,120 L170,130 Z" 
        fill="#FFFFFF" fill-opacity="0.2"/>
  <rect x="172" y="140" width="3" height="10" fill="#FFFFFF" fill-opacity="0.2"/>
  
  <!-- Compass rose -->
  <circle cx="40" cy="175" r="8" fill="#FFFFFF" fill-opacity="0.1"/>
  <path d="M40,167 L42,175 L40,183 L38,175 Z" fill="#FFFFFF" fill-opacity="0.2"/>
  <path d="M32,175 L40,173 L48,175 L40,177 Z" fill="#FFFFFF" fill-opacity="0.2"/>
  
  <!-- Binoculars icon -->
  <circle cx="125" cy="30" r="5" fill="#FFFFFF" fill-opacity="0.2"/>
  <circle cx="135" cy="30" r="5" fill="#FFFFFF" fill-opacity="0.2"/>
  <rect x="125" y="25" width="10" height="10" fill="#FFFFFF" fill-opacity="0.1"/>
  
  <!-- Camera icon -->
  <rect x="80" cy="35" width="12" height="8" rx="2" fill="#FFFFFF" fill-opacity="0.2"/>
  <circle cx="86" cy="39" r="3" fill="#FFFFFF" fill-opacity="0.1"/>
  <rect x="83" y="33" width="6" height="2" fill="#FFFFFF" fill-opacity="0.2"/>
  
  <!-- Horizontal lines (horizon) -->
  <line x1="10" y1="85" x2="40" y2="85" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1"/>
  <line x1="160" y1="85" x2="190" y2="85" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1"/>
  
  <!-- Mountains -->
  <path d="M10,120 L20,105 L30,120 Z" fill="#FFFFFF" fill-opacity="0.15"/>
  <path d="M25,120 L40,100 L55,120 Z" fill="#FFFFFF" fill-opacity="0.15"/>
  
  <!-- Sun/Moon -->
  <circle cx="180" cy="40" r="10" fill="#FFFFFF" fill-opacity="0.2"/>
</svg>